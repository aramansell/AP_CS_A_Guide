<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Revision Banner — class dashboard</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hd">
    <span class="logo">📊</span>
    <div class="hd-txt">
      <h1>Revision Banner</h1>
      <p id="hdSub">class dashboard</p>
    </div>
    <button class="ib" id="btnRefresh" title="Refresh">⟳</button>
    <button class="ib" id="btnOptions" title="Settings">⚙</button>
  </header>

  <div class="search">
    <input id="q" type="search" placeholder="Filter by title or contributor…" autocomplete="off" />
  </div>

  <div class="totals" id="totals"></div>
  <main id="list" class="list"><p class="empty">No tracked documents yet.<br />Open any Google Doc, Sheet or Slide — tracked here automatically.</p></main>

  <footer class="ft">
    <button class="btn" id="btnVerify">Verify a submission…</button>
    <button class="btn" id="btnExport">Export CSV</button>
    <span class="note">100% local data · nothing leaves this machine</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
